<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Table Unavailable | STACKLY</title>
  <link rel="icon" type="image/webp" href="images/logo.webp">

  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #FAF8F3 0%, #EBF3ED 100%); margin: 0; padding: 24px;">

  <!-- 404 Main Area -->
  <main style="width: 100%; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 620px; text-align: center;">
      <!-- Company Logo -->
      <a href="index.html" aria-label="STACKLY Home" style="display: inline-block; margin-bottom: 28px;">
        <img src="images/logo.webp" alt="STACKLY Logo" style="height: 42px; width: auto; display: block;">
      </a>

      <!-- Stylized Dining 404 Icon -->
      <div style="position: relative; width: 120px; height: 120px; margin: 0 auto 28px auto; border-radius: 50%; background: var(--color-sage); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg);">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#167A55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <!-- Plate and Cross Cutlery -->
          <circle cx="12" cy="12" r="10"/>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
        <span style="position: absolute; bottom: -8px; background: var(--color-charcoal); color: var(--color-white); font-family: var(--font-display); font-size: 0.875rem; font-weight: 700; padding: 4px 12px; border-radius: 9999px;">
          ERROR 404
        </span>
      </div>

      <span class="section-eyebrow" style="margin-bottom: 14px;">SEATING UNREACHABLE</span>
      <h1 style="font-size: clamp(2.2rem, 4.5vw, 3.2rem); margin-bottom: 16px; line-height: 1.2;">
        Oops!
      </h1>
      <p style="font-size: 1.0625rem; color: var(--color-muted); line-height: 1.7; margin-bottom: 36px;">
        The page or culinary destination you're looking for may have moved, the address entered may be incorrect.
      </p>

      <div style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
        <button id="goBackHistoryBtn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Go Back</span>
        </button>
        <a href="index.html" class="btn btn-primary">
          <span>Back to Home →</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const backBtn = document.getElementById("goBackHistoryBtn");
      if (backBtn) {
        backBtn.addEventListener("click", () => {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = "index.html";
          }
        });
      }

      if (window.gsap) {
        gsap.from("main .container > *", {
          y: 30,
          opacity: 0,
          duration: 0.8,
          stagger: 0.15,
          ease: "power3.out"
        });
      }
    });
  </script>

</body>
</html>
